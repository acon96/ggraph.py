[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "ggraph"
description = "Python interface engine and graph definition language for GGUF-based models."
authors = [
    { name = "Alex O'Connell", email = "git@alexoconnell.net" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=2.2.6",
    "tokenizers>=0.21.1",
    "jinja2>=3.1.6",
    "lark>=1.2.2",
    "matplotlib",
    "gguf>=0.17.0",
]
dynamic = ["version"]

[project.optional-dependencies]
gen = [
    "ctypeslib2-ggml==0.0.1",
    "clang==14"
]

[project.urls]
Homepage = "https://github.com/acon96/ggraph.py"
Repository = "https://github.com/acon96/ggraph.py"

[tool.scikit-build]
wheel.packages = ["ggraph"]
cmake.verbose = true
cmake.minimum-version = "3.21"
minimum-version = "0.5.1"
sdist.include = [".git", "vendor/llama.cpp/*", "*.ggraph", "ggraph/__version__.py"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "ggraph/__version__.py"

[project.scripts]
ggraph-cli = "ggraph.cli:main"